name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The supported platforms, and both ends of the supported Python
        # range -- the floor is what requires-python promises, and it is the
        # one nobody develops on. The windows entry IS the Windows support
        # claim: nobody here develops on it, so a platform not in this list
        # is a platform the README must not name.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --group dev pytest -q

  # The declared dependency range is a claim about versions we have run.
  # 1.8-1.13 raise TypeError against current pydantic-settings; the floor
  # exists because of that, and this is what keeps it honest.
  mcp-range:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["1.14.0", ""]          # declared floor, and whatever is latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: import and serve under mcp ${{ matrix.mcp || 'latest' }}
        run: |
          if [ -n "${{ matrix.mcp }}" ]; then PIN="--with mcp==${{ matrix.mcp }}"; else PIN=""; fi
          uv run --isolated $PIN --with-editable . python -c "
          import shelfmark.server as s
          assert s.mcp is not None
          print('server constructed OK')"
